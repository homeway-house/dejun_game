<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定緁的種花大作戰 | Dejun's Flower Grower</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; overflow-x: hidden; padding: 10px; }
        header { text-align: center; margin-bottom: 10px; width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { font-size: 1.5rem; color: #4ecca3; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .top-controls { display: flex; gap: 10px; align-items: center; }
        .lang-btn, .sound-btn { background: #0f3460; color: #fff; border: 1px solid #4ecca3; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .lang-btn:hover, .sound-btn:hover { background: #4ecca3; color: #1a1a2e; }
        
        .game-container { display: flex; gap: 15px; width: 100%; max-width: 900px; height: 560px; background: #16213e; border-radius: 15px; border: 2px solid #0f3460; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        
        /* 左側高度塔與進度條 */
        .tower-panel { width: 130px; background: #0f3460; display: flex; flex-direction: column; align-items: center; padding: 15px 5px; border-right: 2px solid #1a1a2e; position: relative; }
        .tower-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; color: #e94560; text-align: center; }
        .tower-track { width: 24px; height: 420px; background: #1a1a2e; border-radius: 12px; position: relative; border: 2px solid #4ecca3; overflow: hidden; }
        .tower-fill { position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #4ecca3, #e94560, #f9ed69); height: 0%; transition: height 0.1s linear; }
        .pointer { position: absolute; left: -10px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 12px solid #fff; transition: bottom 0.1s linear; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)); }
        .milestones { position: absolute; height: 420px; width: 100px; left: 35px; display: flex; flex-direction: column; justify-content: space-between; font-size: 0.75rem; pointer-events: none; padding: 5px 0; }
        .milestone-item { display: flex; align-items: center; gap: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        /* 中間遊戲畫布區 */
        .canvas-panel { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: linear-gradient(to bottom, #87CEEB, #E0F6FF); overflow: hidden; cursor: pointer; }
        canvas { display: block; width: 100%; height: 100%; }
        .click-hint { position: absolute; top: 15px; background: rgba(0, 0, 0, 0.6); color: #fff; padding: 6px 15px; border-radius: 20px; font-size: 0.9rem; pointer-events: none; animation: pulse 1.5s infinite; z-index: 10; }
        
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* 右側升級商店 */
        .upgrade-panel { width: 300px; background: #0f3460; display: flex; flex-direction: column; padding: 12px; border-left: 2px solid #1a1a2e; overflow-y: auto; }
        .upgrade-title { font-size: 1rem; font-weight: bold; margin-bottom: 8px; color: #f9ed69; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .stats-box { font-size: 0.8rem; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; margin-bottom: 10px; line-height: 1.4; border: 1px solid rgba(255,255,255,0.05); }
        .upgrade-list { display: flex; flex-direction: column; gap: 8px; }
        .upgrade-btn { background: #1a1a2e; border: 1px solid #4ecca3; color: #fff; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .upgrade-btn:hover:not(:disabled) { background: #4ecca3; color: #1a1a2e; transform: translateY(-1px); }
        .upgrade-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #555; }
        .upgrade-info { display: flex; flex-direction: column; }
        .upgrade-name { font-size: 0.8rem; font-weight: bold; }
        .upgrade-cost { font-size: 0.7rem; color: #f9ed69; }
        .upgrade-btn:hover:not(:disabled) .upgrade-cost { color: #1a1a2e; }
        .upgrade-lvl { font-size: 0.75rem; background: #e94560; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

        /* 底部資訊列 */
        .bottom-bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.85rem; color: #a0a0a0; padding: 0 5px; }
    </style>
</head>
<body>

    <header>
        <h1 id="game-title">🌱 定緁的種花大作戰</h1>
        <div class="top-controls">
            <button class="sound-btn" id="sound-toggle" onclick="toggleSound()">🔊 音效: 開</button>
            <button class="lang-btn" onclick="toggleLanguage()">🌐 English / 中文</button>
        </div>
    </header>

    <div class="game-container">
        <!-- 左側高度塔 -->
        <div class="tower-panel">
            <div class="tower-title" id="tower-header">高度測量塔</div>
            <div style="position: relative;">
                <div class="tower-track">
                    <div class="tower-fill" id="tower-fill"></div>
                </div>
                <div class="pointer" id="tower-pointer" style="bottom: 0%;"></div>
                <div class="milestones">
                    <div class="milestone-item">🌌 <span>2,000k</span></div>
                    <div class="milestone-item">☀️ <span>1,000k</span></div>
                    <div class="milestone-item">🌕 <span>50k</span></div>
                    <div class="milestone-item">☁️ <span>1k</span></div>
                    <div class="milestone-item">🌱 <span>0</span></div>
                </div>
            </div>
        </div>

        <!-- 中間遊戲畫布 -->
        <div class="canvas-panel" id="click-area" onclick="handleWaterClick(event)">
            <div class="click-hint" id="hint-text">✨ 點擊畫面或澆水筒來灌溉花朵！</div>
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- 右側升級商店 -->
        <div class="upgrade-panel">
            <div class="upgrade-title">
                <span id="shop-title">🛠️ 升級實驗室</span>
                <span id="designer-badge" style="font-size: 0.7rem; color: #4ecca3;">By Dejun</span>
            </div>
            <div class="stats-box">
                <div id="stat-height">🌿 高度: 0 cm</div>
                <div id="stat-drops">💧 水滴: 0 滴</div>
                <div id="stat-power">⚡ 點擊力: +1 cm</div>
            </div>
            <div class="upgrade-list" id="upgrade-list-container">
                <!-- 動態生成升級按鈕 -->
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <span id="footer-designer">🎮 遊戲設計：定緁 (Dejun)</span>
        <span id="footer-status">狀態：冒險成長中...</span>
    </div>

<script>
    let lang = 'zh'; // 'zh' 或 'en'

    const t = {
        zh: {
            title: "🌱 定緁的種花大作戰",
            tower: "高度測量塔",
            hint: "✨ 點擊畫面或澆水筒來灌溉花朵！",
            shop: "🛠️ 升級實驗室",
            designer: "By Dejun",
            footerDesigner: "🎮 遊戲設計：定緁 (Dejun)",
            status: "狀態：冒險成長中...",
            soundOn: "🔊 音效: 開",
            soundOff: "🔇 音效: 關",
            upgrades: [
                { name: "🌱 生長速度 +1", desc: "每次點擊長更高" },
                { name: "🌿 超級萌芽 +5", desc: "瞬間大幅抽高" },
                { name: "💧 水滴加倍 +15", desc: "增加每次獲得水滴" },
                { name: "⚡ 遊戲速度 x2", desc: "解鎖兩倍成長爆發" },
                { name: "🤖 自動澆水器", desc: "每秒自動灌溉花朵" },
                { name: "☀️ 太陽能肥料", desc: "解鎖太陽能量加成" }
            ]
        },
        en: {
            title: "🌱 Dejun's Flower Grower",
            tower: "Height Tower",
            hint: "✨ Click anywhere or watering can to grow!",
            shop: "🛠️ Growth Lab",
            designer: "By Dejun",
            footerDesigner: "🎮 Game Designer: Dejun",
            status: "Status: Growing...",
            soundOn: "🔊 Sound: ON",
            soundOff: "🔇 Sound: OFF",
            upgrades: [
                { name: "🌱 Grow Speed +1", desc: "Grow higher per click" },
                { name: "🌿 Super Sprout +5", desc: "Instant height boost" },
                { name: "💧 Water Boost +15", desc: "More drops per click" },
                { name: "⚡ Speed x2 Boost", desc: "Unlock double growth" },
                { name: "🤖 Auto Waterer", desc: "Automatic watering/sec" },
                { name: "Mega Sun Fertilizer", desc: "Unlock solar fertilizer" }
            ]
        }
    };

    function toggleLanguage() {
        lang = lang === 'zh' ? 'en' : 'zh';
        document.getElementById('game-title').innerText = t[lang].title;
        document.getElementById('tower-header').innerText = t[lang].tower;
        document.getElementById('hint-text').innerText = t[lang].hint;
        document.getElementById('shop-title').innerHTML = `<span>${t[lang].shop}</span><span style="font-size: 0.7rem; color: #4ecca3;">${t[lang].designer}</span>`;
        document.getElementById('footer-designer').innerText = t[lang].footerDesigner;
        updateUI();
        initUpgrades();
    }

    let soundEnabled = true;
    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-toggle').innerText = soundEnabled ? t[lang].soundOn : t[lang].soundOff;
    }

    // 遊戲核心數值
    let height = 0;
    let maxGameHeight = 2000000; // 200萬公分（銀河系隱藏結局）
    let drops = 0;
    let clickPower = 1;
    let dropPower = 1;
    let autoWaterRate = 0;
    let speedMultiplier = 1;
    let sunMultiplier = 1;

    let upgradesData = [
        { id: 0, cost: 15, costMult: 1.8, lvl: 0, effect: () => { clickPower += 1; } },
        { id: 1, cost: 100, costMult: 2.1, lvl: 0, effect: () => { height += 50; } },
        { id: 2, cost: 250, costMult: 2.2, lvl: 0, effect: () => { dropPower += 3; } },
        { id: 3, cost: 600, costMult: 2.5, lvl: 0, effect: () => { speedMultiplier *= 1.5; } },
        { id: 4, cost: 1500, costMult: 2.8, lvl: 0, effect: () => { autoWaterRate += 2; } },
        { id: 5, cost: 5000, costMult: 3.0, lvl: 0, effect: () => { sunMultiplier *= 2; } }
    ];

    function initUpgrades() {
        const container = document.getElementById('upgrade-list-container');
        container.innerHTML = '';
        upgradesData.forEach((item, index) => {
            const dataObj = t[lang].upgrades[index];
            const btn = document.createElement('button');
            btn.className = 'upgrade-btn';
            btn.id = `upgrade-btn-${index}`;
            btn.onclick = () => buyUpgrade(index);
            btn.innerHTML = `
                <div class="upgrade-info">
                    <span class="upgrade-name">${dataObj.name}</span>
                    <span class="upgrade-cost" id="cost-${index}">💧 ${Math.floor(item.cost)}</span>
                </div>
                <span class="upgrade-lvl" id="lvl-${index}">Lv.${item.lvl}</span>
            `;
            container.appendChild(btn);
        });
        updateUpgradesUI();
    }

    function buyUpgrade(index) {
        let item = upgradesData[index];
        if (drops >= item.cost) {
            drops -= item.cost;
            item.cost *= item.costMult;
            item.lvl++;
            item.effect();
            playAudio('upgrade');
            updateUI();
            updateUpgradesUI();
        }
    }

    function updateUpgradesUI() {
        upgradesData.forEach((item, index) => {
            const btn = document.getElementById(`upgrade-btn-${index}`);
            const costEl = document.getElementById(`cost-${index}`);
            const lvlEl = document.getElementById(`lvl-${index}`);
            if (btn && costEl && lvlEl) {
                costEl.innerText = `💧 ${Math.floor(item.cost)}`;
                lvlEl.innerText = `Lv.${item.lvl}`;
                btn.disabled = drops < item.cost;
            }
        });
    }

    function handleWaterClick(e) {
        let gain = clickPower * speedMultiplier * sunMultiplier;
        height += gain;
        drops += dropPower;
        playAudio('water');

        if (height > maxGameHeight) height = maxGameHeight;
        updateUI();
    }

    function updateUI() {
        document.getElementById('stat-height').innerText = `🌿 ${lang === 'zh' ? '高度' : 'Height'}: ${Math.floor(height).toLocaleString()} cm`;
        document.getElementById('stat-drops').innerText = `💧 ${lang === 'zh' ? '水滴' : 'Drops'}: ${Math.floor(drops).toLocaleString()} 滴`;
        document.getElementById('stat-power').innerText = `⚡ ${lang === 'zh' ? '點擊力' : 'Power'}: +${Math.floor(clickPower * speedMultiplier * sunMultiplier)} cm`;

        let percent = Math.min(100, (height / maxGameHeight) * 100);
        document.getElementById('tower-fill').style.height = percent + '%';
        document.getElementById('tower-pointer').style.bottom = percent + '%';
        updateUpgradesUI();
    }

    // Web Audio 簡易合成音效
    let audioCtx = null;
    function playAudio(type) {
        if (!soundEnabled) return;
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        
        let osc = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        let now = audioCtx.currentTime;
        if (type === 'water') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'upgrade') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
            osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    // Canvas 繪圖與動畫系統
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 流星雨動畫粒子
    let meteors = [];
    for (let i = 0; i < 15; i++) {
        meteors.push({
            x: Math.random() * 800,
            y: Math.random() * -500,
            len: Math.random() * 80 + 40,
            speed: Math.random() * 6 + 4
        });
    }

    function gameLoop() {
        // 自動澆水
        if (autoWaterRate > 0) {
            height += (autoWaterRate / 60) * speedMultiplier;
            drops += (autoWaterRate / 60) * 0.5;
            if (height > maxGameHeight) height = maxGameHeight;
            updateUI();
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let w = canvas.width;
        let h = canvas.height;

        // 根據高度決定背景顏色與世界層級
        let isGalaxy = height >= 2000000;
        let isSun = height >= 1000000 && !isGalaxy;
        let isMoon = height >= 50000 && !isSun && !isGalaxy;
        let isCloud = height >= 1000 && !isMoon && !isSun && !isGalaxy;

        // 1. 背景繪製
        if (isGalaxy) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#050510');
            grad.addColorStop(1, '#1b0033');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // 銀河星雲與流星雨
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 60; i++) {
                let px = (i * 37) % w;
                let py = (i * 59) % h;
                ctx.fillRect(px, py, 2, 2);
            }

            // 流星雨劃過
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 2;
            meteors.forEach(m => {
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - m.len, m.y + m.len);
                ctx.stroke();
                m.x += m.speed * 1.5;
                m.y += m.speed * 1.5;
                if (m.x > w + 100 || m.y > h + 100) {
                    m.x = Math.random() * w;
                    m.y = -100;
                }
            });

            // 銀河標題
            ctx.fillStyle = '#f9ed69';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(lang === 'zh' ? '🌌 隱藏結局：銀河系流星雨 (2,000,000 cm)' : '🌌 Hidden Ending: Galaxy Meteor Shower', w / 2, 50);

        } else if (isSun) {
            ctx.fillStyle = '#ff7b00';
            ctx.fillRect(0, 0, w, h);
            // 太陽
            ctx.fillStyle = '#ffea00';
            ctx.beginPath();
            ctx.arc(w / 2, 100, 70, 0, Math.PI * 2);
            ctx.fill();
        } else if (isMoon) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#0b132b');
            grad.addColorStop(1, '#1c2541');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            // 月亮與隕石坑
            ctx.fillStyle = '#e0e0e0';
            ctx.beginPath();
            ctx.arc(w - 90, 90, 45, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#b0b0b0';
            ctx.beginPath();
            ctx.arc(w - 105, 80, 10, 0, Math.PI * 2);
            ctx.arc(w - 75, 110, 7, 0, Math.PI * 2);
            ctx.fill();
        } else if (isCloud) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#4a90e2');
            grad.addColorStop(1, '#c5e3f6');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            // 雲朵
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(120, 150, 35, 0, Math.PI * 2);
            ctx.arc(155, 140, 45, 0, Math.PI * 2);
            ctx.arc(190, 150, 30, 0, Math.PI * 2);
            ctx.fill();
        } else {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#87CEEB');
            grad.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            // 地面草地
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(0, h - 40, w, 40);
        }

        // 2. 繪製花盆與花朵（動態花莖生長系統）
        let potX = w / 2;
        let potY = h - 50;

        // 花盆
        ctx.fillStyle = '#b5651d';
        ctx.beginPath();
        ctx.moveTo(potX - 30, potY);
        ctx.lineTo(potX + 30, potY);
        ctx.lineTo(potX + 22, potY + 45);
        ctx.lineTo(potX - 22, potY + 45);
        ctx.closePath();
        ctx.fill();

        // 花莖高度計算（視覺化拉長，最高延伸到畫面頂部）
        let stemMaxVisualHeight = h - 160;
        let progressRatio = Math.min(1, height / maxGameHeight);
        let currentStemHeight = progressRatio * stemMaxVisualHeight;

        // 繪製綠色花莖
        ctx.strokeStyle = '#4ecca3';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(potX, potY);
        ctx.lineTo(potX, potY - currentStemHeight);
        ctx.stroke();

        // 沿著花莖每隔一段距離長出綠葉
        let leafCount = Math.floor(currentStemHeight / 40);
        for (let i = 1; i <= leafCount; i++) {
            let leafY = potY - (i * 40);
            let dir = (i % 2 === 0) ? 1 : -1;
            ctx.fillStyle = '#26a69a';
            ctx.beginPath();
            ctx.ellipse(potX + (dir * 18), leafY, 15, 7, dir * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }

        // 花朵本體（長在花莖最頂端）
        let flowerTopY = potY - currentStemHeight;
        
        // 花瓣
        ctx.fillStyle = isGalaxy ? '#f9ed69' : (isSun ? '#ff5722' : '#ffeb3b');
        for (let i = 0; i < 8; i++) {
            let angle = (i * Math.PI / 4);
            let fx = potX + Math.cos(angle) * 22;
            let fy = flowerTopY + Math.sin(angle) * 22;
            ctx.beginPath();
            ctx.arc(fx, fy, 12, 0, Math.PI * 2);
            ctx.fill();
        }
        // 花心
        ctx.fillStyle = '#8d6e63';
        ctx.beginPath();
        ctx.arc(potX, flowerTopY, 14, 0, Math.PI * 2);
        ctx.fill();

        // 澆水桶小圖示裝飾
        ctx.fillStyle = '#90caf9';
        ctx.fillRect(potX + 60, potY + 10, 25, 18);
        ctx.fillRect(potX + 85, potY + 14, 8, 10);

        requestAnimationFrame(gameLoop);
    }

    // 初始化啟動
    initUpgrades();
    updateUI();
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
